[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osrs-ge-market-intel"
dynamic = ["version"]
description = "Tax-aware trade ideas and anomaly alerts for the OSRS Grand Exchange, with measured reliability."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sylvester Koh" }]
# Code: MIT (ADR-0014). Sample data is CC BY-NC-SA 3.0 and not covered by it (ADR-0013).
license = "MIT"
license-files = ["LICENSE"]
# Pins proven in spike S1 (ADR-0003); the uv lockfile fixes the full tree.
dependencies = [
    "deltalake>=1.6.6,<1.7",
    "duckdb>=1.5.6,<1.6",
    "dbt-core>=1.12.6,<1.13",
    "dbt-duckdb>=1.11.0,<1.12",
    "pyarrow>=26.0.0,<27",
    "jsonschema>=4.26,<5",
]

[project.scripts]
ge-intel = "ge_intel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/ge_intel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ge_intel"]

[tool.uv]
# Lock for the runner and the laptop alike.
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures are recorded data; the dump's own README must stay byte-identical to its pin.
extend-exclude = ["docs/research/probes", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
