name: history

# The M2 history job (ADR-0018) on a throwaway runner instead of the laptop (ADR-0020). Started
# on request only: by Sylvester from the Actions tab, or by an agent he has asked to run it,
# through the API. No GitHub schedule (it never fired reliably here, ADR-0017); repeat runs are
# the requester's to schedule. Each run restores the job's raw Wiki responses from R2, takes the
# pinned Kaggle dump (from the Actions cache after the first run), rebuilds history/ on the
# runner's disk, runs the chosen step and saves any new responses back to R2. Runbook:
# "History (M2)". Two steps only read: `reprocess` rebuilds history/prices_1h with PySpark and
# checks parity with the DuckDB build and with R2 (ADR-0011, amended), and `benchmark` times the
# same job in DuckDB, Polars and PySpark. `airflow` runs Airflow 3 on the runner and the
# history DAG end to end, twice (ADR-0004, amended). None of the three writes to R2 or asks the
# Wiki.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "plan (no download, nothing sent), build (download and build only), check-1h, fill, check-and-fill (both, one run), upload, reprocess (PySpark rebuild and parity), benchmark or airflow (the history DAG, end to end)"
        type: choice
        options: [plan, build, check-1h, fill, check-and-fill, upload, reprocess, benchmark, airflow]
        default: plan
      dry_run:
        description: "check-1h, fill, check-and-fill, upload: report only, send and write nothing"
        type: boolean
        default: true
      limit:
        description: "fill: at most this many buckets (empty: all)"
        required: false

permissions:
  contents: read

# history/ has one writer: this job, one run at a time (ADR-0018). It never writes the live
# tables, so it stays out of the hourly workflow's group.
concurrency:
  group: ge-intel-history-writer
  cancel-in-progress: false

jobs:
  run:
    # One image for every run, so benchmark timings compare (ubuntu-latest is moving to 26.04,
    # whose default Java is 25; Spark is pinned to 17 below).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dump (4.8 GB), the local lake (about 2 GB) and DuckDB's spill (up to 2 GB) need
      # about 9 GB; removing SDKs this job never uses leaves a wide margin over the 14 GB listed.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          # Saved from main only: a branch's uv cache (about 2 GB with PySpark built from
          # source) would crowd the hourly job's out of the repository's 10 GB.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --locked
      # The batch engines (engines/): their own lockfile, so PySpark and Polars stay out of the
      # hourly path's environment.
      - name: Set up Java 17
        if: contains(fromJSON('["reprocess", "benchmark", "airflow"]'), inputs.step)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the batch engines
        if: contains(fromJSON('["reprocess", "benchmark", "airflow"]'), inputs.step)
        run: uv sync --locked --project engines
      # Dataset version 1 never changes, and `download` checks every restored file against its
      # pin, so a fixed key is safe.
      - id: dump
        if: inputs.step != 'plan'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/history/kaggle
          key: kaggle-osrs-ge-5m-v1
      # The DAG's own tasks pull, download and build for `airflow`.
      - name: Restore raw Wiki responses from R2
        if: inputs.step != 'airflow'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run ge-intel history pull
      - name: Plan
        if: inputs.step == 'plan'
        run: uv run ge-intel history plan
      - name: Download the Kaggle dump
        if: inputs.step != 'plan' && inputs.step != 'airflow'
        run: uv run ge-intel history download
      # Cached as soon as it is verified, so a later failure does not cost a second download.
      - if: inputs.step != 'plan' && inputs.step != 'airflow' && steps.dump.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/history/kaggle
          key: kaggle-osrs-ge-5m-v1
      - name: Build history/ on the runner
        if: inputs.step != 'plan' && inputs.step != 'airflow'
        run: uv run ge-intel history build
      # First downloads record the dump's file hashes in the pins file; they must be committed
      # (a small PR), so they are shown here and in the run summary.
      - name: Kaggle hashes recorded by this run
        if: always() && inputs.step != 'plan' && inputs.step != 'airflow'
        run: |
          if ! git diff --quiet -- src/ge_intel/sources/; then
            git diff -- src/ge_intel/sources/
            {
              echo "### Kaggle hashes recorded by this run: commit them"
              echo '```diff'
              git diff -- src/ge_intel/sources/
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # check-and-fill runs the month checks, then the fill, in one run: one dispatch carries
      # the job to the point of upload. A quarantined month is a result, not a failure; it
      # stays out of the upload and waits for a decision (plan, section 5.1).
      - name: Wiki requests
        if: contains(fromJSON('["check-1h", "fill", "check-and-fill"]'), inputs.step)
        env:
          STEP: ${{ inputs.step }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$STEP" = check-and-fill ]; then
            uv run ge-intel history check-1h $DRY
            uv run ge-intel history fill $DRY ${LIMIT:+--limit "$LIMIT"}
          else
            uv run ge-intel history "$STEP" $DRY ${LIMIT:+--limit "$LIMIT"}
          fi
      # Runs even if the requests stopped partway, so nothing fetched is fetched twice.
      - name: Save new raw Wiki responses to R2
        if: always() && contains(fromJSON('["check-1h", "fill", "check-and-fill"]'), inputs.step) && !inputs.dry_run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: uv run ge-intel history push
      - name: Upload validated months to R2
        if: inputs.step == 'upload'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run ge-intel history upload $DRY
      # PySpark rebuilds history/prices_1h from the same inputs on disk (ADR-0011, amended): the
      # dump and the stored responses, never R2 (ADR-0015).
      - name: Rebuild prices_1h with PySpark
        if: inputs.step == 'reprocess'
        run: >-
          uv run --project engines ge-spark reprocess --history-dir data/history
          --out data/history/spark --threads 4 --memory 10g --local-dir data/tmp/spark
          --report data/evidence/spark_report.json
      # Parity: the PySpark build against this runner's DuckDB build, and both against R2's own
      # record (its Delta log, the months manifest, and a copy of its files: about one GET each).
      # Reads only.
      - name: Parity with the DuckDB build and R2
        if: inputs.step == 'reprocess'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run ge-intel history parity --r2-files
          cp data/history/parity.json data/evidence/
      - name: Benchmark DuckDB, Polars and PySpark
        if: inputs.step == 'benchmark'
        run: |
          uv run --project engines ge-bench prep --history-dir data/history --out data/bench
          status=0
          uv run --project engines ge-bench all --history-dir data/history --out data/bench \
            --repeat 3 --threads 4 --memory-gb 6 --memory-max 12G || status=$?
          mkdir -p data/evidence
          cp data/bench/results.json data/evidence/benchmark.json || true  # kept even on failure
          exit "$status"
      # Airflow from its constraints file, in a step with no secrets in reach.
      - name: Install Airflow 3.3.2
        if: inputs.step == 'airflow'
        run: orchestration/ci/install_airflow.sh
      # Airflow 3 with Postgres on the runner; the DAG's tasks call the contract (`ge-intel run`)
      # and read R2 only to pull the stored responses and to compare counts. Reads only. The
      # script moves the credentials into a file only those tasks load, before Airflow starts.
      # The dump is downloaded by the DAG's own task and not cached from here: one 4.8 GB
      # entry per branch would fill the repository's cache.
      - name: Airflow 3, the history DAG end to end
        if: inputs.step == 'airflow'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: orchestration/ci/run_airflow.sh
      # A runner whose memory runs out loses its job with only "The operation was canceled";
      # say so in the log when it happens.
      - name: Memory, if the job failed
        if: failure() && contains(fromJSON('["reprocess", "benchmark", "airflow"]'), inputs.step)
        run: |
          free -m
          sudo dmesg -T | grep -i -E 'out of memory|killed process|oom' | tail -5 || true
      # Counts, checksums and timings only: no price data leaves the runner.
      - name: Keep the evidence
        if: always() && contains(fromJSON('["reprocess", "benchmark", "airflow"]'), inputs.step)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.step }}-${{ github.run_id }}
          path: data/evidence/
          retention-days: 90
          if-no-files-found: warn
