name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pinned to commit SHAs (ADR-0014); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit, contract (recorded payloads) and end-to-end (every task, dbt included) tests.
      - run: uv run pytest
      # The Worker config and assets must pass Wrangler's own checks before any deploy.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --prefix site --ignore-scripts --no-audit --no-fund
      - name: wrangler deploy --dry-run
        working-directory: site
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          cp -R src dist
          npx --no-install wrangler deploy --dry-run --config wrangler.jsonc
      # ge-clock: unit tests and Wrangler's checks of its config (ADR-0017).
      - run: node --test clock/test/index.test.mjs
      - name: wrangler deploy --dry-run (ge-clock)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --prefix site --no-install wrangler deploy --dry-run --config clock/wrangler.jsonc

  # The batch engines (engines/, ADR-0011 amended): their unit tests, the three-engine benchmark
  # on synthetic data, and the PySpark rebuild against the DuckDB build on the fixture month.
  spark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv sync --locked --extra dev --project engines
      - name: Engine tests
        working-directory: engines
        run: uv run pytest
      - name: PySpark against the DuckDB build
        run: uv run pytest -m spark

  # The history DAG (orchestration/, ADR-0004 amended) imports cleanly and keeps its shape, in
  # Airflow's own environment and constraints.
  airflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install Airflow 3.3.2 with its constraints
        run: |
          uv venv "$RUNNER_TEMP/airflow-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/airflow-venv/bin/python" "apache-airflow==3.3.2" \
            pytest --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - name: DAG integrity
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow"
          "$RUNNER_TEMP/airflow-venv/bin/python" -m pytest -q -p no:cacheprovider orchestration/tests
